<div *ngIf="user" class="container">
    <div class="profile">
        <img [src]="user.imgUrl" alt="User's Image">
        <h2>{{user.name}}</h2>
        <div class="info">
            <p>Age: {{user.age}}</p>
            <p>Hobbies: {{user.hobbies}}</p>
            <p>Sports: {{user.sports}}</p>
        </div>
    </div>
</div>
